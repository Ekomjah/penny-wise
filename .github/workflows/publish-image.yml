
name: Build and Publish Docker Images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/freeCodeCampSummerCohort26/penny-wise-backend:latest
            ghcr.io/freeCodeCampSummerCohort26/penny-wise-backend:${{ github.sha }}
